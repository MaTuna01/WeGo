# WeGo 서버 배포(VM 한 대). 클라우드 전용 서비스 없이 Docker만 있으면 됨(가비아 -> AWS 이전 시 그대로 사용)
# 실행: deploy 폴더에서 docker compose up -d --build
# 사전 준비: wegoBackEnd/.env 작성(POSTGRES_PASSWORD 필수), api.wegoride.site와 wegoride.site A 레코드를 이 VM 공인 IP로, 방화벽에서 80/443만 열기
# 메모리(VM 2GB + 스왑 기준): api 1GB, db 512MB 한도. 넘으면 그 컨테이너만 재시작됨

services:
  db:
    # PostgreSQL 17 + PostGIS 3.5(amd64, arm64 모두 제공. 테스트의 Testcontainers와 같은 이미지)
    image: imresamu/postgis:17-3.5
    # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD로 처음 시작할 때 DB와 계정을 만듦(볼륨이 비어 있을 때만)
    env_file: ../.env
    # 작은 VM에 맞춰 공유 메모리와 연결 수를 줄임(api 커넥션 풀 5개)
    command: postgres -c shared_buffers=128MB -c max_connections=30
    # 포트를 열지 않음. 같은 compose 네트워크의 api만 db:5432로 접근
    volumes:
      # DB 데이터. docker compose down -v 나 볼륨 삭제 시 모두 사라짐(백업은 README 참고)
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
    image: wego-api:latest
    # 서울시 API 인증키, DB 접속 정보 등. 이 파일은 커밋하지 않음
    env_file: ../.env
    environment:
      # 컨테이너 안 포트는 8080 고정(.env의 SERVER_PORT보다 우선)
      SERVER_PORT: "8080"
      # DB는 compose 서비스 이름으로 접근(.env의 DB_HOST, DB_PORT보다 우선)
      DB_HOST: db
      DB_PORT: "5432"
    # 외부에 열지 않고 Caddy만 내부 네트워크로 접근
    expose:
      - "8080"
    # DB가 접속을 받을 수 있을 때 시작(Flyway가 시작 시 마이그레이션함)
    depends_on:
      db:
        condition: service_healthy
    # JVM 힙은 이 한도의 75%(Dockerfile의 MaxRAMPercentage)
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    # 80은 인증서 발급과 HTTPS 리다이렉트, 443은 HTTPS(HTTP/3는 UDP)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # wegoride.site 정적 페이지(처리방침, 지원). 파일만 바꾸면 재시작 없이 반영됨
      - ./site:/srv/site:ro
      # 발급받은 인증서 보관(지우면 다시 발급받음, 발급 횟수 제한 주의)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  caddy_data:
  caddy_config:
