# WeGo 최소 서버 배포(VM 한 대). 클라우드 전용 서비스 없이 Docker만 있으면 됨(가비아 -> AWS 이전 시 그대로 사용)
# 실행: deploy 폴더에서 docker compose up -d --build
# 사전 준비: wegoBackEnd/.env 작성, api.wegoride.site A 레코드를 이 VM 공인 IP로, 방화벽에서 80/443만 열기

services:
  api:
    build:
      context: ..
    image: wego-api:latest
    # 서울시 API 인증키 등. 이 파일은 커밋하지 않음
    env_file: ../.env
    environment:
      # 컨테이너 안 포트는 8080 고정(.env의 SERVER_PORT보다 우선)
      SERVER_PORT: "8080"
    # 외부에 열지 않고 Caddy만 내부 네트워크로 접근
    expose:
      - "8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    # 80은 인증서 발급과 HTTPS 리다이렉트, 443은 HTTPS(HTTP/3는 UDP)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서 보관(지우면 다시 발급받음, 발급 횟수 제한 주의)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
