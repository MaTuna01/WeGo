spring:
  application:
    name: wegoBackEnd
  autoconfigure:
    # 로그인이 없으므로 기본 사용자(임시 비밀번호)는 만들지 않음
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # PostgreSQL(PostGIS). 접속 정보는 .env에만 둠(배포는 docker-compose가 DB_HOST=db로 덮어씀)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:wego}
    username: ${POSTGRES_USER:wego}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # 요청 대부분이 메모리 응답이라 연결은 적게 둠(VM 메모리 2GB)
      maximum-pool-size: 5
  jpa:
    # 스키마는 Flyway만 바꿈. Hibernate는 엔티티와 테이블이 맞는지만 확인
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 정류장 갱신 때 수천 행을 저장하므로 INSERT, UPDATE를 묶어서 보냄
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    # 마이그레이션 파일 위치: src/main/resources/db/migration (V1__설명.sql)
    locations: classpath:db/migration
  mvc:
    # 오류 응답을 RFC 9457 ProblemDetail로 전송.
    problemdetails:
      enabled: true

server:
  # 포트는 환경 변수 SERVER_PORT로 지정, 없으면 8080
  port: ${SERVER_PORT:8080}
  # Caddy가 앞에서 HTTPS를 받아 중계함. X-Forwarded-* 헤더로 원래 요청 정보 사용
  forward-headers-strategy: native
  # 정류장 목록(약 2,700곳, 수백 KB)을 gzip으로 압축해 보냄. 앱(URLSession)은 자동으로 풂
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

wego:
  app:
    # 최소 지원 앱 버전. 환경 변수 WEGO_MINIMUM_VERSION으로 지정, 없으면 1.0.0
    minimum-version: ${WEGO_MINIMUM_VERSION:1.0.0}
  stations:
    # 정류장 목록 갱신 주기, 한 번도 받지 못했을 때 재시도 간격
    refresh-interval: PT6H
    retry-interval: PT1M
  seoul-bike:
    # 서울 열린데이터광장 공공자전거 API 인증키. 환경 변수 SEOUL_OPEN_API_KEY로만 주입, 없으면 수집 안 함
    api-key: ${SEOUL_OPEN_API_KEY:}
    # 서울시 API는 HTTP(8088)만 제공함
    base-url: http://openapi.seoul.go.kr:8088
    page-size: 1000
    max-pages: 10
    connect-timeout: PT5S
    read-timeout: PT20S

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 모든 로그 줄에 앱 버전(X-App-Version)을 첨부
    level: "%5p [app %X{appVersion:-}]"
